gui:
  theme:
    lightTheme: false 
    activeBorderColor:
      - "#a6e3a1" # Green
      - bold
    inactiveBorderColor:
      - "#cdd6f4" # Text
    optionsTextColor:
      - "#89b4fa" # Blue
    selectedLineBgColor:
      - "#313244" # Surface0
    selectedRangeBgColor:
      - "#313244" # Surface0
    cherryPickedCommitBgColor:
      - "#94e2d5" # Teal
    cherryPickedCommitFgColor:
      - "#89b4fa" # Blue
    unstagedChangesColor:
      - red       # Red


customCommands:
  # Mit diesem command, der im 'Branches Menu (3)' gescoped ist, können Branches mittels ein paar Promprts angelegt werden,
  # die dem Namensschema im EWK-Projekt folgen.
  - key: 'E'
    description: 'EWK: Create branch'
    context: 'localBranches'
    prompts:
      - type: 'menu'
        title: 'What kind of branch?'
        key: 'BranchType'
        options:
          - name: 'feature'
            description: 'a feature branch'
            value: 'feature'
          - name: 'task'
            description: 'a task branch'
            value: 'task'
          - name: 'fix'
            description: 'a bugfix branch'
            value: 'fix'
          - name: 'maintenance'
            description: 'a branch for maintenance work'
            value: 'maintenance'
          - name: 'technical'
            description: 'a branch for technical work'
            value: 'technical'
          - name: 'experimental'
            description: 'a branch for experimental work'
            value: 'experimental'
          - name: 'documentation'
            description: 'a branch for documentation work'
            value: 'documentation'
          - name: 'hotfix'
            description: 'a hotfix branch after a release'
            value: 'hotfix'
      - type: 'input'
        title: 'Ticket number (leave empty if there is no ticket)?'
        key: 'TicketNumber'
        initialValue: ''
      - type: 'input'
        title: 'Branch name?'
        key: 'BranchName'
        initialValue: ''
    command: >
      git checkout -b {{.Form.BranchType}}/
      {{- if .Form.TicketNumber -}}
        EWK-{{.Form.TicketNumber}}-
      {{- end -}}
      {{.Form.BranchName}}
    loadingText: 'Creating branch'

  # Mit diesem command, der im 'Changes Menu (2)' gescoped ist, können Commits erstellt werden, die dem Namensschema im EWK-Projekt folgen.
  # Die EWK-Nummer wird dabei automatisch aus dem Branchnamen extrahiert.
  - key: 'E'
    description: 'EWK: Create commit'
    context: 'files'
    prompts:
      - type: 'input'
        title: 'Commit description'
        key: 'Description'
        initialValue: ''
    command: |
      #!/bin/bash
      BRANCH={{.SelectedLocalBranch.Name}}
      TICKET=$(echo "$BRANCH" | grep -oP 'EWK-\d+' || echo "NONE")
      TYPE=${BRANCH%%/*}
      MESSAGE=$([ "$TICKET" != "NONE" ] && echo "$TICKET {{.Form.Description}}" || echo "$TYPE - {{.Form.Description}}")
      git commit -m "$MESSAGE"
    loadingText: 'Creating commit'
